server:
  port: 8800

spring:
  mongodb:
    host: mongodb-finance
    port: 27017
    username: ${MONGO_FINANCE_USER}
    password: ${MONGO_FINANCE_PASSWORD}
    authentication-database: admin

internal-jwt:
  issuer: marketsync-gateway
  audience: finance-service
  public-key-pem: ${PUBLIC_KEY_PEM}

management:
  endpoints:
    web:
      exposure:
        include: health,info